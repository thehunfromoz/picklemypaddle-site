# Checks every pull request and every push to main.
# On main, publishes the tested image to GHCR as :staging and :<sha>;
# home-server pulls :staging automatically (SCRUM-16).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Unit, build and functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install
        run: pnpm install --frozen-lockfile=${{ hashFiles('pnpm-lock.yaml') != '' }}
      - name: Unit tests
        run: pnpm test:unit
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Functional tests (build + preview)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Container image + header tests
    needs: [test, secrets-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: picklemypaddle-site:test
          build-args: |
            SITE_URL=http://home-server
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Run image
        run: docker run -d --name site -p 8080:80 picklemypaddle-site:test && sleep 3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install test tools
        run: pnpm install --frozen-lockfile=${{ hashFiles('pnpm-lock.yaml') != '' }} && pnpm exec playwright install --with-deps chromium
      - name: Tests against the container (headers, CSP, 404, pages)
        env:
          BASE_URL: http://localhost:8080
        run: pnpm test:e2e
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: picklemypaddle-site:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish :staging and :sha
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag picklemypaddle-site:test $IMAGE:staging
          docker tag picklemypaddle-site:test $IMAGE:${{ github.sha }}
          docker push $IMAGE:staging
          docker push $IMAGE:${{ github.sha }}
