# Checks every pull request and push to main using the shared workflows in
# picklemypaddle-infra (SCRUM-13/15). On main, the image job publishes
# :staging and :<sha> (plus the smoke-test image); home-server pulls :staging.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: thehunfromoz/picklemypaddle-infra/.github/workflows/node-checks.yml@main
    with:
      # check:lighthouse audits the dist/ that test:e2e just built (SCRUM-37), so it stays after test:e2e.
      scripts: lint check test:unit test:e2e check:lighthouse check:secrets check:links
      playwright: true
      # The same Node as the Dockerfile's build stage (SCRUM-58).
      node-version: '26'
      report-path: |
        playwright-report
        lighthouse-report

  secrets:
    uses: thehunfromoz/picklemypaddle-infra/.github/workflows/secret-scan.yml@main

  image:
    needs: [checks, secrets]
    uses: thehunfromoz/picklemypaddle-infra/.github/workflows/image.yml@main
    permissions:
      contents: read
      packages: write
    with:
      # One image serves staging and production (a release only re-tags it), so it is built
      # with the PRODUCTION address: canonical links, og:url, the sitemap and robots.txt must
      # never name staging. On staging (noindex, private) canonicals naming the live site are
      # harmless. SCRUM-19.
      build-args: |
        SITE_URL=https://www.picklemypaddle.com
      container-test: ci/container-test.sh
      setup-node: true
      node-version: '26'
      extra-images: |
        picklemypaddle-site-smoke:test=ghcr.io/thehunfromoz/picklemypaddle-site-smoke
      # SCRUM-34: the Keystatic blog editor, staging only (Dockerfile.editor). Also tagged :staging so
      # home-server's updater keeps it current. Never part of a release or of production.
      staging-extra-images: |
        picklemypaddle-site-editor:test=ghcr.io/thehunfromoz/picklemypaddle-site-editor
